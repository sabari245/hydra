# Hydra STT configuration.
#
# Location: ~/.config/hydra-stt/config.toml ($XDG_CONFIG_HOME is respected,
# and HYDRA_STT_CONFIG can point to another file).
#
# This file may hold API keys, so keep it private (chmod 600). Hydra STT
# creates it that way and warns if other users can read it. Environment
# variables GROQ_API_KEY, GROQ_MODEL and ISO_QUANT_API_KEY override the
# values below, if you prefer to keep keys out of this file.

[groq]
# Speech-to-text. Required.
api_key = ""
# Run `hydra-stt --models` to list the models on your account.
model = "whisper-large-v3-turbo"

[isoquant]
# Post-processing with IsoQuant models. When disabled, or when a request
# fails, the raw transcript is typed instead.
enabled = true
api_key = ""
api_url = "https://api.isoquant.ai/v1"
timeout_secs = 30

[router]
# With more than one profile, the System One decision model picks the profile
# for each transcript from the profile descriptions. Below min_confidence
# (0-1), or when routing fails, the default profile is used.
model = "isoquant/system-one"
instructions = "Choose which profile should process this dictated speech."
min_confidence = 0.5

# Profiles. Each one runs its prompt on the transcript with an IsoQuant chat
# model. "default" is required and is the fallback. With only
# [profiles.default], no routing happens. The built-in profiles use built-in
# prompts and descriptions when those are left empty:
#   default   clean up dictation and type it
#   prompt    turn rambling speech into a clear AI prompt and type it
# Defining any [profiles.*] table replaces this set, so list every profile you
# want. Custom profiles need a prompt and a description, for example:
#
# [profiles.email]
# description = "An email or a reply to one."
# prompt = "Rewrite the transcript as a polite, concise email body. ..."

[profiles.default]
model = "glm-5.3-flash"
description = ""
prompt = ""

[profiles.prompt]
model = "glm-5.3-flash"
description = ""
prompt = ""

[history]
# Each profile sees its last few inputs and outputs, kept in
# ~/.local/share/hydra-stt/history.
enabled = true
entries = 10

[recording]
# ALSA capture device passed to `arecord -D`. Empty uses the system default.
# List devices with `arecord -L`.
device = ""

[sounds]
enabled = true
# Percent, 0-100.
volume = 90
# Custom WAV files. Comment out to use the built-in cues.
# press = "/path/to/press.wav"
# release = "/path/to/release.wav"

[media]
# Pause MPRIS players (via playerctl) while recording and resume them after.
pause_while_recording = true

[output]
# Press Enter after typing the transcript (submits chat prompts and commands).
press_enter = false
# How line breaks in the transcript are typed:
#   "space"        join everything into one line (safe everywhere)
#   "shift_enter"  keep line breaks, typed as Shift+Enter. Works in browsers,
#                  chat apps and Claude Code; in some terminals Shift+Enter is
#                  sent as plain Enter and submits early.
newlines = "space"

[logging]
# Defaults to ~/.local/state/hydra-stt ($XDG_STATE_HOME is respected).
# dir = "/path/to/logs"
