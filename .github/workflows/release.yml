name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: Also build for Windows
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Oldest glibc the binaries link against (Debian 11, Ubuntu 20.04+).
  GLIBC: "2.31"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - name: Install packaging tools
        run: cargo install --locked cargo-zigbuild cargo-deb

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ env.GLIBC }}

      - name: Package tar.gz
        run: |
          name=hydra-stt-${{ matrix.target }}
          mkdir -p dist "$name"
          cp target/${{ matrix.target }}/release/hydra-stt README.md LICENSE config.example.toml \
            assets/hydra-stt.desktop "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

      - name: Package deb
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} \
            --output "dist/hydra-stt_${{ matrix.deb_arch }}.deb"

      - name: Checksums
        working-directory: dist
        run: for file in *; do sha256sum "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # Optional: on for manual runs with the box ticked, and for tags unless the
  # repository variable BUILD_WINDOWS is set to "false".
  build-windows:
    name: Build x86_64-pc-windows-msvc
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.windows) ||
      (github.event_name == 'push' && vars.BUILD_WINDOWS != 'false')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked

      - name: Package zip
        run: |
          name=hydra-stt-x86_64-pc-windows-msvc
          mkdir -p dist "$name"
          cp target/release/hydra-stt.exe README.md LICENSE config.example.toml "$name/"
          7z a "dist/$name.zip" "$name"

      - name: Checksums
        working-directory: dist
        run: for file in *; do sha256sum "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist/*

  release:
    name: Publish release
    needs: [build, build-windows]
    # Publishes without Windows when that build was skipped, not when it failed.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.build-windows.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Hydra STT $GITHUB_REF_NAME" --generate-notes
