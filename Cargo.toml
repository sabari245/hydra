[package]
name = "hydra-stt"
version = "0.1.0"
edition = "2024"
description = "Push-to-toggle speech-to-text dictation for Linux"
repository = "https://github.com/sabari245/hydra"
readme = "README.md"
license = "MIT"
authors = ["Vorden <sabari2004@hotmail.com>"]
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland"] }
nix = { version = "0.29", features = ["signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
toml_edit = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Vorden <sabari2004@hotmail.com>"
section = "sound"
priority = "optional"
depends = "libc6 (>= 2.31), libwayland-client0, alsa-utils, pulseaudio-utils, wtype"
recommends = "playerctl, libegl1, libxkbcommon0"
extended-description = """\
Hydra STT records speech on a hotkey, transcribes it with Groq Whisper, \
optionally cleans the transcript, and types it into the focused window. \
Open Hydra STT from your applications menu to add your API keys and start it."""
assets = [
    ["target/release/hydra-stt", "usr/bin/", "755"],
    ["assets/hydra-stt.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/hydra-stt/", "644"],
    ["config.example.toml", "usr/share/doc/hydra-stt/", "644"],
]
