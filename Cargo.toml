[package]
name = "hydra-stt"
version = "0.2.0"
edition = "2024"
description = "Push-to-toggle speech-to-text dictation for Linux and Windows"
repository = "https://github.com/sabari245/hydra"
readme = "README.md"
license = "MIT"
authors = ["Vorden <sabari2004@hotmail.com>"]
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "io-util", "net", "signal", "sync", "time"] }
toml = "0.9"
toml_edit = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal"] }
zbus_systemd = { version = "0.26200.0", default-features = false, features = ["systemd1", "zbus-async-tokio"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Vorden <sabari2004@hotmail.com>"
section = "sound"
priority = "optional"
depends = "libc6 (>= 2.31), libwayland-client0, alsa-utils, pulseaudio-utils, wtype"
recommends = "playerctl, libegl1, libxkbcommon0"
extended-description = """\
Hydra STT records speech on a hotkey, transcribes it with Groq Whisper, \
optionally cleans the transcript, and types it into the focused window. \
Open Hydra STT from your applications menu to add your API keys and start it."""
assets = [
    ["target/release/hydra-stt", "usr/bin/", "755"],
    ["assets/hydra-stt.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/hydra-stt/", "644"],
    ["config.example.toml", "usr/share/doc/hydra-stt/", "644"],
]
