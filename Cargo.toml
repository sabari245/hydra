[package]
name = "hydra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3"
global-hotkey = "0.6"
nix = { version = "0.29", features = ["signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
